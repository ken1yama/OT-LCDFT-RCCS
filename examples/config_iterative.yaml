# =====================================================================
# param_opt_RCCS.py OTと構造最適化の繰り返し（mode: iterative）
#
#   ot-g16sub config_iterative.yaml
#
# ωの最適チューニング（OT）と、その ω での構造最適化を、ωと構造が
# 互いに整合するまで繰り返す。全体が1本のジョブで実行される。
#
#   （任意）最初の構造最適化                initial_optimization: true
#   反復 n:
#     [OT] 現在の構造で OT → ω_n           |ω_n − ω_{n−1}| < omega_threshold なら終了
#     [構造最適化] ω_n で構造最適化         構造が変わらなければ終了（OT をしても ω は同じ）
#
#   終了したときの (ω, 構造) は、「構造はその ω（との差が omega_threshold 未満）で最適化されている」
#   かつ「その構造で OT すると、その ω になる」を満たす。判定は |Δω| の1つだけ。
#
# - 2回目以降の OT は、前回の OT の結果から最小値の位置を予測して絞り込むので、2〜3点で終わる
# - 汎関数・基底関数（Gen/GenECP を含む）・%mem・その他のキーワードは gjf の記述をそのまま使う
#   （gjf の Opt / Freq は取り除かれ、構造最適化のステップでだけ opt_keyword が付く）
# - optimization_mode は omega_only のみ。α・β は全反復で固定（優先順位: YAML > gjf の IOp > 汎関数のデフォルト）
# - 各ステップは iter0_opt/, iter1_ot/, iter1_opt/, iter2_ot/, … のフォルダで計算される
# - 中断しても、同じコマンドで再投入すれば、終わっているステップを読み込んで続きから再開する
#   （use_existing_outputs を書き換える必要はない）
# =====================================================================

mode: iterative

molecule:
  gjf_file: benzene.gjf        # 基準となるgjf（このフォルダに置く）

calculation:
  nproc_per_job: 8             # OTの1状態あたりのコア数（ジョブ全体は ×3 = 24コア）
  # ※ 3状態の合計は64コアまで。構造最適化はジョブ全体のコア（この例では24）で1本計算する
  #nproc_per_state:
  #  q0: 12
  #  q1: 18
  #  qm1: 18
  job_walltime: '168:00:00'    # 繰り返し全体のwalltime（OT と構造最適化を何回も行うので長めに）
  mail: false                  # true: ジョブの開始・終了時にメールで通知

optimization:
  # ---- 1回目のOT（通常の mode: ot と同じ設定）----
  optimization_mode: omega_only   # iterative では omega_only のみ
  optimization_algorithm: brent
  omega_min: 0.12
  omega_max: 0.5
  omega_digits: 4              # 小数点以下の桁数（2〜4）。omega_threshold より細かくしておく
  n_calls: 15
  max_parallel_jobs: 3

  # ---- α・β（全反復で固定。null / default なら gjf の IOp、それもなければ汎関数のデフォルト）----
  fixed_alpha: null            # 指定するときは β も指定する（例: beta_mode: constraint, beta_constraint: 1.0）
  beta_mode: default           # default / constraint（α+β=C）/ fixed
  beta_constraint: null
  fixed_beta: null
  epsilon: 1.0
  # ※ iterative では keep_files は使わず、計算ファイルはすべて残す（再開と Guess=Read に使うため）

iteration:
  omega_threshold: 0.001       # 収束の判定: |Δω|（bohr⁻¹）。論文で報告する桁（多くは小数点以下2桁）より細かければ十分
                               # （omega_digits の丸めの幅 0.0001 の数倍以上にする）
  max_iterations: 5            # 反復の最大回数（ふつうは2〜3回で収束する。達したら「収束していません」として終了）
  initial_optimization: false  # true: 最初に gjf の条件（gjf の ω、なければ汎関数のデフォルト）で構造最適化する
                               # （ふつうは不要。gjf の構造が手で組んだものなど、大きく崩れているときに使う）
  search_range: 0.02           # 2回目以降のOT: 予測した ω が前回の ω ± この幅を超えるときは、予測を使わずに
                               # 挟み込みで探索する（それでも挟めなければ omega_min〜omega_max で探索し直す）
  opt_keyword: Opt             # 構造最適化のキーワード（例: 'Opt=(CalcFC,MaxCycles=200)'）
  # ※ 以前の rmsd_threshold, max_displacement_threshold, j_threshold, final_optimization は使わなくなった
  #   （書いてあっても無視される）
