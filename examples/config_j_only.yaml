# =====================================================================
# param_opt_RCCS.py J値の計算のみ（mode: j_only）
#
#   ot-g16sub config_j_only.yaml
#
# gjfの条件（汎関数・基底関数・構造）で q0 / q1 / qm1 を1回ずつ計算し、
# IP・EA・HOMO・J値を <gjf名>_j_only_results.txt に出力する。
#
# パラメーター（ω, α, β）の優先順位: このYAMLの値 > gjfのIOp > 汎関数のデフォルト
#   gjfに IOp(3/107,3/108)（ω）、IOp(3/130,3/131)（α）、IOp(3/119,3/120)（β）を
#   書いておけば、下はすべて null / default のままでよい。
# =====================================================================

mode: j_only

molecule:
  gjf_file: benzene.gjf        # 基準となるgjf（このフォルダに置く）

calculation:
  nproc_per_job: 8             # 1状態あたりのコア数（ジョブ全体は ×3 = 24コア）
  # ※ 3状態の合計は64コアまで（3つの計算を1ノード内で走らせるため）
  # 状態ごとに変える場合は、下の4行の # を消す
  #nproc_per_state:
  #  q0: 8
  #  q1: 12
  #  qm1: 12
  job_walltime: '24:00:00'     # ジョブのwalltime
  mail: false                  # true: ジョブの開始・終了時にメールで通知

optimization:
  max_parallel_jobs: 3         # q0, q1, qm1 を同時に計算（1なら順番に）

  # ---- パラメーター（null / default なら gjf の IOp、それもなければ汎関数のデフォルト）----
  fixed_omega: null            # 例: 0.17
  fixed_alpha: null            # 例: 0.2
  beta_mode: default           # default（gjfのIOpまたは汎関数のデフォルト）/ constraint（α+β=C）/ fixed
                               # ※ α を指定するとき（YAML か gjf）は、β も指定が必要（α + β ≤ 1 を確認するため）
  beta_constraint: null        # constraint のとき: 数値 C、または solvent（C = 1/ε）
  fixed_beta: null             # fixed のときのβ
  epsilon: 1.0                 # beta_constraint: solvent のときの比誘電率
